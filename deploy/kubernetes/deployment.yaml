apiVersion: apps/v1
kind: Deployment
metadata:
  name: ba-py03-db-browser-smoke
  namespace: deployflow-test
  labels: &id001
    app.kubernetes.io/name: ba-py03-db-browser-smoke
    app.kubernetes.io/managed-by: deployflow
    app.kubernetes.io/instance: 106a5048-920f-42be-a927-c37619dcb572
spec:
  replicas: 1
  selector:
    matchLabels: *id001
  template:
    metadata:
      labels: *id001
      annotations:
        deployflow.io/config-sha256: 8afa172660e0c13ac4db29d77d6eae5efb1595971e0d799cc3d3d68704705ef1
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: ba-py03-db-browser-smoke
        image: ghcr.io/damibegud/m-py03-reading-shelves:914c1925d2daa4da323ac3691c3e208c99553e36
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8203
          name: http
        envFrom:
        - configMapRef:
            name: ba-py03-db-browser-smoke-config
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: ba-py03-postgres-smoke
              key: DATABASE_URL
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        readinessProbe:
          httpGet:
            path: /health/ready
            port: http
        livenessProbe:
          httpGet:
            path: /health/live
            port: http
        startupProbe:
          httpGet:
            path: /health/live
            port: http
          failureThreshold: 15
          periodSeconds: 5
